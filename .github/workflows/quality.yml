name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Build for Cloudflare Workers
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-key
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.example
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          ADMIN_EMAILS: ci@example.invalid
        run: npx opennextjs-cloudflare build
