name: Deploy Brindare test to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirmar publicação do ambiente de teste brindare-web-test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brindare-cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy/cloudflare-free-test' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: deploy/cloudflare-free-test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate required build secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret ausente: $name"
              exit 1
            fi
          done

      - name: TypeScript validation
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Build for Cloudflare Workers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://brindare-web.brindare-maceio.workers.dev
        run: npx opennextjs-cloudflare build

      - name: Deploy test Worker and preserve dashboard variables/secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy -- --keep-vars
